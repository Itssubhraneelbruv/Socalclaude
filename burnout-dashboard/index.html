<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BurnoutWatch — HR Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f4f0;
      color: #1a1a1a;
      height: 100vh;
      overflow: hidden;
    }

    .app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 210px;
      min-width: 210px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 16px;
      border-bottom: 1px solid #e8e8e8;
      cursor: pointer;
      user-select: none;
    }

    .logo-icon {
      width: 30px; height: 30px;
      background: #1a1a1a;
      color: #fff;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .logo-text { font-size: 14px; font-weight: 600; flex: 1; }
    .logo-chevron { color: #999; font-size: 12px; }

    .sidebar-nav { padding: 10px 0; flex: 1; overflow-y: auto; }

    .nav-group-label {
      font-size: 10px; font-weight: 600; color: #aaa;
      letter-spacing: 0.8px; text-transform: uppercase;
      padding: 14px 16px 4px;
    }

    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 16px;
      font-size: 13.5px; color: #555;
      cursor: pointer;
      transition: background 0.1s;
      user-select: none;
    }

    .nav-item:hover { background: #f5f4f0; }
    .nav-item.active { color: #1a1a1a; font-weight: 600; background: #f5f4f0; }

    .nav-icon { width: 18px; text-align: center; font-size: 14px; opacity: 0.65; }
    .nav-item.active .nav-icon { opacity: 1; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

    /* ── Top Tabs ── */
    .top-tabs {
      display: flex;
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      flex-shrink: 0;
    }

    .tab {
      padding: 14px 32px;
      font-size: 14px; color: #888;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer; font-family: inherit;
      transition: color 0.12s;
      margin-bottom: -1px;
    }

    .tab:hover { color: #333; }
    .tab.active { color: #1a1a1a; font-weight: 500; border-bottom-color: #c0392b; }

    /* ── Content ── */
    .content { display: flex; flex: 1; overflow: hidden; }

    /* ── Center Panel ── */
    .center-panel { flex: 1; padding: 24px 28px; overflow-y: auto; min-width: 0; }

    .alert-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px;
    }

    .alert-header h2 { font-size: 18px; font-weight: 600; }

    .alert-count {
      background: #fef3f2; color: #c0392b;
      font-size: 12px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
      border: 1px solid #fcd0cb;
    }

    /* ── Slide Nav ── */
    .slide-nav {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px;
    }

    .slide-btn {
      width: 32px; height: 32px;
      border: 1px solid #e0e0e0; background: #fff;
      border-radius: 6px; cursor: pointer;
      font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.1s, border-color 0.1s;
      font-family: inherit;
    }

    .slide-btn:hover:not(:disabled) { background: #f0f0f0; border-color: #ccc; }
    .slide-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .slide-dots { display: flex; gap: 7px; align-items: center; }

    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      border: none; background: #ddd;
      cursor: pointer; padding: 0;
      transition: background 0.15s, transform 0.15s;
    }

    .dot:hover { background: #bbb; }
    .dot.current { background: #c0392b; transform: scale(1.25); }
    .dot.is-assigned { background: #27ae60; }
    .dot.is-dismissed { background: #ccc; }

    .slide-counter { font-size: 13px; color: #999; margin-left: 2px; }

    /* ── Alert Card ── */
    .alert-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .alert-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }

    .alert-card.high::before { background: #c0392b; }
    .alert-card.medium::before { background: #e07b54; }

    .action-badge {
      position: absolute; top: 16px; right: 16px;
      font-size: 12px; font-weight: 600;
      padding: 4px 12px; border-radius: 20px;
    }

    .action-badge.assigned { background: #edfbf1; color: #1e8449; border: 1px solid #a9dfbf; }
    .action-badge.dismissed { background: #f5f5f5; color: #888; border: 1px solid #ddd; }

    .card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 20px;
    }

    .employee-info { display: flex; align-items: center; gap: 12px; }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
    }

    .avatar.high { background: #c0392b; }
    .avatar.medium { background: #e07b54; }

    .employee-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; }
    .employee-role { font-size: 13px; color: #777; }

    /* ── Team Health view ── */
    .team-health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 6px;
    }

    .roster-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 10px;
      padding: 18px 16px;
      position: relative;
      overflow: hidden;
      cursor: default;
    }

    .roster-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
    }

    .roster-card.high::before   { background: #c0392b; }
    .roster-card.medium::before { background: #e07b54; }
    .roster-card.healthy::before { background: #27ae60; }

    .roster-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      margin-bottom: 12px;
    }

    .roster-avatar.high    { background: #c0392b; }
    .roster-avatar.medium  { background: #e07b54; }
    .roster-avatar.healthy { background: #27ae60; }

    .roster-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .roster-role { font-size: 12px; color: #888; margin-bottom: 10px; }

    .roster-status {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
    }

    .roster-status.high    { background: #fef3f2; color: #c0392b; border: 1px solid #fcd0cb; }
    .roster-status.medium  { background: #fff8f3; color: #e07b54; border: 1px solid #fde5d4; }
    .roster-status.healthy { background: #edfbf1; color: #1e8449; border: 1px solid #a9dfbf; }

    .roster-view-link {
      display: block; margin-top: 8px;
      font-size: 12px; color: #c0392b;
      cursor: pointer; text-decoration: none;
    }

    .roster-view-link:hover { text-decoration: underline; }

    /* ── Jimmy profile view ── */
    .profile-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 18px; flex-wrap: wrap;
    }

    .back-btn {
      padding: 6px 12px; font-size: 13px;
      border: 1px solid #e0e0e0; background: #fff;
      border-radius: 6px; cursor: pointer; font-family: inherit;
      color: #666; transition: background 0.1s; flex-shrink: 0;
    }

    .back-btn:hover { background: #f5f5f5; }
    .profile-period { font-size: 13px; color: #aaa; font-weight: 400; margin-left: 4px; }

    .profile-tabs {
      display: flex;
      border-bottom: 1px solid #e8e8e8;
      margin-bottom: 20px;
    }

    .profile-tab {
      padding: 10px 20px; font-size: 13.5px;
      color: #888; background: none; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer; font-family: inherit;
      transition: color 0.1s; margin-bottom: -1px;
    }

    .profile-tab:hover { color: #333; }
    .profile-tab.active { color: #1a1a1a; font-weight: 500; border-bottom-color: #c0392b; }

    .profile-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; margin-bottom: 20px;
    }

    .profile-table th {
      text-align: left; color: #aaa;
      font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
      padding: 0 12px 8px 0; border-bottom: 1px solid #f0f0f0;
    }

    .profile-table td {
      padding: 9px 12px 9px 0; color: #444;
      border-bottom: 1px solid #f8f8f8; vertical-align: middle;
    }

    .profile-table tr:last-child td { border-bottom: none; }

    .phys-summary { display: flex; gap: 10px; margin-bottom: 20px; }

    .phys-stat {
      flex: 1; padding: 14px; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 8px;
    }

    .phys-stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .phys-stat-value { font-size: 20px; font-weight: 700; line-height: 1.2; color: #1a1a1a; }
    .phys-stat-value.red { color: #c0392b; }
    .phys-stat-sub { font-size: 11px; color: #bbb; margin-top: 3px; }

    .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 80px; margin-bottom: 20px; }

    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }

    .bar {
      width: 100%; border-radius: 3px 3px 0 0;
      min-height: 4px; transition: opacity 0.15s;
    }

    .bar-lbl { font-size: 10px; color: #aaa; }

    .ceiling-note {
      background: #fff8f3; border: 1px solid #fde5d4;
      border-radius: 8px; padding: 12px 14px;
      font-size: 13px; color: #c0392b; margin-bottom: 16px;
    }

    .ema-entries { display: flex; flex-direction: column; gap: 18px; }

    .ema-day { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }

    .ema-pre { font-size: 12px; color: #888; margin-bottom: 6px; }

    .ema-tag {
      background: #f0f0f0; color: #888;
      font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 10px;
      margin-right: 6px; text-transform: uppercase; letter-spacing: 0.3px;
    }

    .ema-bubble {
      background: #fafafa; border: 1px solid #f0f0f0;
      border-left: 3px solid #c0392b;
      border-radius: 0 8px 8px 0;
      padding: 10px 14px; font-size: 13.5px;
      color: #444; line-height: 1.65; font-style: italic;
    }

    .env-note { font-size: 11px; color: #bbb; margin-top: 4px; }

    .risk-badge-wrap { text-align: right; }

    .risk-badge {
      display: inline-block; font-size: 12px; font-weight: 600;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 4px;
    }

    .risk-badge.high { background: #fef3f2; color: #c0392b; border: 1px solid #fcd0cb; }
    .risk-badge.medium { background: #fff8f3; color: #e07b54; border: 1px solid #fde5d4; }
    .detected-date { font-size: 12px; color: #aaa; }

    /* ── Sentiment Row ── */
    .sentiment-row {
      display: flex; gap: 24px; align-items: flex-start;
      padding: 16px; background: #fafafa;
      border: 1px solid #f0f0f0; border-radius: 8px;
      margin-bottom: 18px;
    }

    .score-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .score-value { font-size: 38px; font-weight: 700; line-height: 1; }
    .score-max { font-size: 16px; font-weight: 400; color: #ccc; }
    .score-sub { font-size: 11px; color: #bbb; margin-top: 5px; }
    .chart-wrap { flex: 1; }
    .chart-label { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

    /* ── AI Summary ── */
    .ai-summary { margin-bottom: 18px; }

    .section-label {
      font-size: 10px; font-weight: 600; color: #aaa;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 7px;
    }

    .ai-summary p { font-size: 14px; color: #444; line-height: 1.65; }

    /* ── Snippets ── */
    .snippets { margin-bottom: 22px; }

    .snippet {
      padding: 10px 12px;
      background: #fafafa;
      border: 1px solid #f0f0f0;
      border-left: 3px solid #e0e0e0;
      border-radius: 0 6px 6px 0;
      margin-bottom: 6px;
    }

    .snippet-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .snippet-time { font-size: 11px; color: #bbb; }
    .snippet-text { font-size: 13px; color: #555; font-style: italic; line-height: 1.5; }

    /* ── Actions ── */
    .alert-actions { display: flex; gap: 10px; }

    .btn-assign {
      padding: 10px 22px;
      background: #c0392b; color: #fff;
      border: none; border-radius: 7px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }

    .btn-assign:hover:not(:disabled) { background: #a93226; }
    .btn-assign.done { background: #27ae60; }
    .btn-assign:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-dismiss {
      padding: 10px 18px;
      background: #fff; color: #888;
      border: 1px solid #ddd; border-radius: 7px;
      font-size: 14px; cursor: pointer; font-family: inherit;
      transition: background 0.12s;
    }

    .btn-dismiss:hover:not(:disabled) { background: #f5f5f5; }
    .btn-dismiss:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Right Panel ── */
    .right-panel {
      width: 275px; min-width: 275px;
      border-left: 1px solid #e8e8e8;
      background: #fff;
      overflow-y: auto;
    }

    .panel-section {
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .panel-section:last-child { border-bottom: none; }

    .summary-tabs { display: flex; gap: 6px; margin-bottom: 14px; }

    .summary-tab {
      padding: 5px 12px; font-size: 12px;
      border: 1px solid #e0e0e0; border-radius: 20px;
      background: #fff; cursor: pointer; font-family: inherit;
      color: #888; transition: all 0.12s;
    }

    .summary-tab.active { background: #c0392b; color: #fff; border-color: #c0392b; }

    .stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .stat-card {
      padding: 12px; border-radius: 8px; border: 1px solid #f0f0f0;
    }

    .stat-card.high { background: #fef3f2; border-color: #fcd0cb; }
    .stat-card.medium { background: #fff8f3; border-color: #fde5d4; }
    .stat-card.green {
      background: #edfbf1; border-color: #a9dfbf;
      grid-column: span 2;
      display: flex; align-items: center; gap: 10px;
    }

    .stat-num { font-size: 26px; font-weight: 700; line-height: 1; margin-bottom: 3px; }
    .stat-card.high .stat-num { color: #c0392b; }
    .stat-card.medium .stat-num { color: #e07b54; }
    .stat-card.green .stat-num { color: #1e8449; font-size: 22px; margin: 0; }
    .stat-lbl { font-size: 11px; color: #888; }
    .stat-card.green .stat-lbl { color: #1e8449; font-size: 12px; }

    /* ── Team Table ── */
    .team-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

    .team-table th {
      text-align: left; color: #aaa;
      font-size: 10px; font-weight: 600; letter-spacing: 0.6px;
      padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;
    }

    .team-table td {
      padding: 9px 0; color: #444;
      border-bottom: 1px solid #f8f8f8;
      vertical-align: middle;
    }

    .team-table tr:last-child td { border-bottom: none; }

    .status-pill {
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 10px;
    }

    .status-pill.high { background: #fef3f2; color: #c0392b; }
    .status-pill.medium { background: #fff8f3; color: #e07b54; }
    .status-pill.low { background: #edfbf1; color: #1e8449; }

    /* ── Pipeline ── */
    .pipeline { display: flex; flex-direction: column; gap: 11px; }

    .pipe-step { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #bbb; }
    .pipe-step.done { color: #27ae60; }
    .pipe-step.active { color: #c0392b; font-weight: 500; }

    .pipe-icon {
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; flex-shrink: 0;
    }

    .pipe-step.done .pipe-icon { background: #edfbf1; color: #27ae60; }
    .pipe-step.active .pipe-icon { background: #fef3f2; color: #c0392b; }
    .pipe-step:not(.done):not(.active) .pipe-icon { background: #f5f5f5; color: #ccc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, Fragment } = React;

    // Normalize RMSSD (observed range 5–42.3 ms) to a 0–100 recovery score
    const rmssdToScore = v => Math.round((v - 5) / (42.3 - 5) * 100);

    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

    function PhysioTab({ daily, ws }) {
      const rmssdScores = daily.map(d => rmssdToScore(d.physiology.night_rmssd_ms));
      const maxScore = Math.max(...rmssdScores);
      return (
        <div>
          <div className="phys-summary">
            <div className="phys-stat">
              <div className="phys-stat-label">RMSSD Mon → Fri</div>
              <div className="phys-stat-value red">{ws.night_rmssd_ms.pct_change_mon_to_fri}%</div>
              <div className="phys-stat-sub">{ws.night_rmssd_ms.monday} → {ws.night_rmssd_ms.friday} ms</div>
            </div>
            <div className="phys-stat">
              <div className="phys-stat-label">Sleep Mon → Fri</div>
              <div className="phys-stat-value red">{ws.sleep_duration_h.monday}h → {ws.sleep_duration_h.friday}h</div>
              <div className="phys-stat-sub">Weekend total: {ws.sleep_duration_h.weekend_total}h</div>
            </div>
            <div className="phys-stat">
              <div className="phys-stat-label">Recovery Returned</div>
              <div className="phys-stat-value red">{ws.recovery_return.returned ? "Yes" : "No"}</div>
              <div className="phys-stat-sub">Sunday RMSSD: {ws.night_rmssd_ms.sunday} ms</div>
            </div>
          </div>

          <div className="section-label" style={{marginBottom: 8}}>7-Day Recovery Score (RMSSD-based)</div>
          <div className="bar-chart">
            {rmssdScores.map((v, i) => (
              <div key={i} className="bar-col">
                <div className="bar" style={{
                  height: Math.max(4, (v / maxScore) * 68),
                  background: v < 40 ? "#c0392b" : v < 55 ? "#e07b54" : "#27ae60",
                }} />
                <div className="bar-lbl">{DAYS[i]}</div>
              </div>
            ))}
          </div>

          <div className="section-label" style={{marginBottom: 8}}>Daily Metrics</div>
          <table className="profile-table">
            <thead>
              <tr>
                <th>Day</th><th>Sleep (h)</th><th>RMSSD (ms)</th>
                <th>Pulse (bpm)</th><th>EDA (µS)</th><th>Steps</th>
              </tr>
            </thead>
            <tbody>
              {daily.map((d, i) => (
                <tr key={i}>
                  <td><strong>{DAYS[i]}</strong></td>
                  <td style={{color: d.physiology.sleep_duration_h < 5 ? "#c0392b" : "#444"}}>
                    {d.physiology.sleep_duration_h}
                  </td>
                  <td style={{color: d.physiology.night_rmssd_ms < 20 ? "#c0392b" : d.physiology.night_rmssd_ms < 25 ? "#e07b54" : "#444"}}>
                    {d.physiology.night_rmssd_ms}
                  </td>
                  <td>{d.physiology.work_pulse_rate_bpm != null ? d.physiology.work_pulse_rate_bpm : "—"}</td>
                  <td>{d.physiology.work_eda_usiemens != null ? d.physiology.work_eda_usiemens : "—"}</td>
                  <td>{d.physiology.daily_steps.toLocaleString()}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function PsychTab({ workdays }) {
      const scaleColor = (v, max, higherIsBetter) => {
        const bad = higherIsBetter ? v <= Math.floor(max * 0.4) : v >= Math.ceil(max * 0.75);
        const mid = higherIsBetter ? v <= Math.floor(max * 0.6) : v >= Math.ceil(max * 0.55);
        return bad ? "#c0392b" : mid ? "#e07b54" : "#27ae60";
      };
      return (
        <div>
          <div className="section-label" style={{marginBottom: 8}}>
            Pre-shift · Energy &amp; Sleep Quality: higher is better &nbsp;|&nbsp; Workload Expected: higher is worse
          </div>
          <table className="profile-table">
            <thead>
              <tr>
                <th>Day</th><th>Energy /7</th><th>Sleep Quality /5</th>
                <th>Workload Expected /7</th><th>Appraisal</th>
              </tr>
            </thead>
            <tbody>
              {workdays.map((d, i) => {
                const pre = d.ema?.pre_shift;
                if (!pre) return null;
                return (
                  <tr key={i}>
                    <td><strong>{d.weekday}</strong></td>
                    <td style={{color: scaleColor(pre.energy_1_7, 7, true)}}>{pre.energy_1_7}/7</td>
                    <td style={{color: scaleColor(pre.sleep_quality_1_5, 5, true)}}>{pre.sleep_quality_1_5}/5</td>
                    <td style={{color: scaleColor(pre.workload_expected_1_7, 7, false)}}>{pre.workload_expected_1_7}/7</td>
                    <td style={{color: pre.appraisal === "threat" ? "#c0392b" : pre.appraisal === "challenge" ? "#27ae60" : "#888"}}>
                      {pre.appraisal}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          <div className="section-label" style={{marginBottom: 8}}>Post-shift · all scales: higher is worse</div>
          <table className="profile-table">
            <thead>
              <tr>
                <th>Day</th><th>Fatigue /7</th><th>Stress /7</th><th>Detachment Difficulty /7</th>
              </tr>
            </thead>
            <tbody>
              {workdays.map((d, i) => {
                const post = d.ema?.post_shift;
                if (!post) return null;
                return (
                  <tr key={i}>
                    <td><strong>{d.weekday}</strong></td>
                    <td style={{color: scaleColor(post.fatigue_1_7, 7, false)}}>{post.fatigue_1_7}/7</td>
                    <td style={{color: scaleColor(post.stress_1_7, 7, false)}}>{post.stress_1_7}/7</td>
                    <td style={{color: scaleColor(post.detachment_difficulty_1_7, 7, false)}}>{post.detachment_difficulty_1_7}/7</td>

    function SelfReportTab({ workdays, ws }) {
      return (
        <div>
          {ws.self_report_ceiling && (
            <div className="ceiling-note">
              ⚠ {ws.self_report_ceiling.note}
            </div>
          )}
          <div className="ema-entries">
            {workdays.map((d, i) => {
              const pre  = d.ema?.pre_shift;
              const post = d.ema?.post_shift;
              if (!post) return null;
              return (
                <div key={i}>
                  <div className="ema-day">{d.weekday} · {d.date}</div>
                  {pre && (
                    <div className="ema-pre">
                      <span className="ema-tag">Pre-shift</span>
                      Energy {pre.energy_1_7}/7 · Sleep quality {pre.sleep_quality_1_5}/5 · Appraisal: <em>{pre.appraisal}</em>
                    </div>
                  )}
                  <div className="ema-bubble">{post.free_text}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function EnvTab({ workdays, targets }) {
      const params = [
        { key: "co2_ppm_mean",                label: "CO₂ (ppm)",       targetStr: "<800",   isBad: v => v > 800 },
        { key: "sound_level_dba_mean",         label: "Sound (dBA)",     targetStr: "~45",    isBad: v => v > 55 },
        { key: "illuminance_lux_mean",         label: "Illuminance (lux)",targetStr: "~100",  isBad: v => false },
        { key: "color_temp_kelvin_mean",       label: "Color Temp (K)",  targetStr: "~3000",  isBad: v => v > 4000 },
        { key: "air_temperature_celsius_mean", label: "Air Temp (°C)",   targetStr: "21–23",  isBad: v => v > 23 },
        { key: "relative_humidity_pct_mean",   label: "Humidity (%)",    targetStr: "40–60",  isBad: v => v < 40 || v > 60 },
      ];
      return (
        <div>
          <table className="profile-table">
            <thead>
              <tr>
                <th>Parameter</th>
                <th>Target</th>
                {workdays.map(d => <th key={d.weekday}>{d.weekday}</th>)}
              </tr>
            </thead>
            <tbody>
              {params.map(p => (
                <tr key={p.key}>
                  <td>{p.label}</td>
                  <td style={{color: "#aaa"}}>{p.targetStr}</td>
                  {workdays.map((d, i) => {
                    const raw = d.environment_core_hours[p.key];
                    const val = typeof raw === "number" ? (raw % 1 === 0 ? raw : parseFloat(raw.toFixed(1))) : "—";
                    return (
                      <td key={i} style={{color: p.isBad(raw) ? "#c0392b" : "#444"}}>{val}</td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
          <div className="env-note">Core shift hours (09:00–17:00) only. Red = outside recommended range.</div>
        </div>
      );
    }

    function JimmyProfile({ data, profileTab, setProfileTab, onBack }) {
      const workdays = data.daily.filter(d => d.is_workday);
      const TAB_LABELS = ["Physiological", "Psychological", "Self-reported", "Environmental"];
      return (
        <div className="center-panel">
          <div className="profile-header">
            <button className="back-btn" onClick={onBack}>← Back</button>
            <h2>Jimmy <span className="profile-period">Aug 3–9, 2026</span></h2>
            <span className="risk-badge high">High Risk</span>
          </div>
          <div className="profile-tabs">
            {TAB_LABELS.map(t => (
              <button
                key={t}
                className={`profile-tab ${profileTab === t.toLowerCase() ? "active" : ""}`}
                onClick={() => setProfileTab(t.toLowerCase())}
              >{t}</button>
            ))}
          </div>
          {profileTab === "physiological" && <PhysioTab daily={data.daily} ws={data.week_summary} />}
          {profileTab === "psychological"  && <PsychTab workdays={workdays} />}
          {profileTab === "self-reported"  && <SelfReportTab workdays={workdays} ws={data.week_summary} />}
          {profileTab === "environmental"  && <EnvTab workdays={workdays} targets={data.ieq_targets} />}
        </div>
      );
    }

    function buildJimmyAlert(data) {
      const ws    = data.week_summary;
      const daily = data.daily;
      const fri   = daily[4]; // Friday
      const tue   = daily[1];
      const wed   = daily[2];
      return {
        id: 4,
        name: "Jimmy",
        initials: "JM",
        role: "Software Engineer",
        team: "Engineering",
        risk: "High",
        score: rmssdToScore(ws.night_rmssd_ms.friday),
        trend: daily.map(d => rmssdToScore(d.physiology.night_rmssd_ms)),
        date: "Aug 8, 2026",
        dataSource: "wearable",
        scoreLabel: "Recovery Score",
        scoreSub: "Based on overnight RMSSD · ↓ Lower = higher strain",
        trendLabel: "7-Day RMSSD Trend",
        signalLabel: "Flagged EMA Check-ins",
        signalIcon: "📋",
        summary: `Wearable data shows overnight RMSSD dropped ${Math.abs(ws.night_rmssd_ms.pct_change_mon_to_fri)}% Mon→Fri (${ws.night_rmssd_ms.monday} → ${ws.night_rmssd_ms.friday} ms). Recovery has not returned after the weekend — Sunday RMSSD matches Friday's floor. ${ws.after_hours_work_minutes_total} min of after-hours work this week. Self-report hit 7/7 on fatigue and detachment by Friday while physiology continued to deteriorate.`,
        snippets: [
          { time: "Fri EMA · Aug 8, 5:00 PM", text: fri.ema.post_shift.free_text },
          { time: "Wed EMA · Aug 6, 5:04 PM", text: wed.ema.post_shift.free_text },
          { time: "Tue EMA · Aug 5, 5:12 PM", text: tue.ema.post_shift.free_text },
        ],
      };
    }

    const BASE_ALERTS = [
      {
        id: 1,
        name: "Sarah",
        initials: "SC",
        role: "Senior Engineer",
        team: "Platform Team",
        risk: "High",
        score: 23,
        trend: [68, 60, 51, 43, 37, 29, 23],
        date: "Aug 7, 2026",
        scoreLabel: "Sentiment Score",
        scoreSub: "↓ Lower = higher burnout risk",

        signalLabel: "Flagged Slack Messages",
        signalIcon: "💬",

        snippets: [

      },
      {

        snippets: [

    const ROSTER = [

      { name: "Priya",   initials: "P",  role: "UX Designer",      team: "Design Team",   risk: "medium",  alertId: 3 },

      { name: "Ijin",    initials: "IJ", role: "Data Analyst",      team: "Engineering",   risk: "healthy", alertId: null },
      { name: "Batuhan", initials: "B",  role: "Backend Engineer",  team: "Backend Team",  risk: "healthy", alertId: null },

    const BASE_TEAM_STATS = [

    const NAV = [

      { label: "Alerts",          icon: "🔔", group: null },
      { label: "Sentiment",       icon: "◎",  group: "Analytics" },
      { label: "Trends",          icon: "↗",  group: "Analytics" },
      { label: "Team Health",     icon: "♡",  group: "Analytics" },
      { label: "Assign Time Off", icon: "📅", group: "Actions" },
      { label: "Reports",         icon: "📊", group: "Actions" },
      { label: "Settings",        icon: "⚙",  group: "Actions" },
    ];

    /* SVG line chart — no external deps */
    function TrendChart({ data, color }) {
      const W = 190, H = 60;
      const pts = data.map((v, i) =>
        `${(i / (data.length - 1)) * W},${H - (v / 100) * H}`
      ).join(" ");
      const lx = W;
      const ly = H - (data[data.length - 1] / 100) * H;
      return (
        <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ display: "block" }}>
          <polyline fill="none" stroke={color} strokeWidth="2.5"
            strokeLinecap="round" strokeLinejoin="round" points={pts} />
          <circle cx={lx} cy={ly} r="4" fill={color} />
        </svg>
      );
    }

    function App() {
      const [idx, setIdx]             = useState(0);
      const [alerts, setAlerts]       = useState(BASE_ALERTS);
      const [assigned, setAssigned]   = useState(new Set());
      const [dismissed, setDismissed] = useState(new Set());
      const [activeNav, setActiveNav] = useState("Alerts");
      const [activeTab, setActiveTab] = useState("Dashboard");
      const [jimmyData, setJimmyData] = useState(null);
      const [profileView, setProfileView] = useState(null);
      const [profileTab, setProfileTab]   = useState("physiological");

      useEffect(() => {
        fetch("jimmy_week.json")
          .then(r => r.json())
          .then(data => {
            setJimmyData(data);
            setAlerts(prev => [...prev, buildJimmyAlert(data)]);
          })
          .catch(err => console.warn("Could not load jimmy_week.json:", err));
      }, []);

      const alert      = alerts[idx] ?? alerts[0];
      const total      = alerts.length;
      const pending    = alerts.filter(a => !assigned.has(a.id) && !dismissed.has(a.id)).length;
      const isAssigned  = assigned.has(alert.id);
      const isDismissed = dismissed.has(alert.id);
      const accent      = alert.risk === "High" ? "#c0392b" : "#e07b54";

      const handleAssign = () => setAssigned(s => new Set([...s, alert.id]));

      const handleDismiss = () => setDismissed(s => new Set([...s, alert.id]));

      let lastGroup = null;

      return (
        <div className="app">

          {/* ── Sidebar ── */}
          <aside className="sidebar">
            <div className="sidebar-logo">
              <div className="logo-icon">HR</div>
              <span className="logo-text">AcmeCorp HR</span>
              <span className="logo-chevron">⌄</span>
            </div>
            <nav className="sidebar-nav">
              {NAV.map(item => {
                const showGroup = item.group && item.group !== lastGroup;
                if (item.group) lastGroup = item.group;
                return (
                  <Fragment key={item.label}>
                    {showGroup && <div className="nav-group-label">{item.group}</div>}
                    <div
                      className={`nav-item ${activeNav === item.label ? "active" : ""}`}
                      onClick={() => setActiveNav(item.label)}
                    >
                      <span className="nav-icon">{item.icon}</span>
                      {item.label}
                    </div>
                  </Fragment>
                );
              })}
            </nav>
          </aside>

          {/* ── Main ── */}
          <div className="main">

            {/* Top tabs */}
            <div className="top-tabs">
              {["Dashboard", "Alerts", "Analytics", "Settings"].map(tab => (
                <button
                  key={tab}
                  className={`tab ${activeTab === tab ? "active" : ""}`}
                  onClick={() => { setActiveTab(tab); if (tab === "Alerts") setActiveNav("Alerts"); }}
                >
                  {tab}
                </button>
              ))}
            </div>

            <div className="content">

              {/* ── Jimmy profile drill-down ── */}
              {profileView === "jimmy" && jimmyData ? (
                <JimmyProfile
                  data={jimmyData}
                  profileTab={profileTab}
                  setProfileTab={setProfileTab}
                  onBack={() => setProfileView(null)}
                />
              ) : activeNav === "Team Health" ? (
                <div className="center-panel">
                  <div className="alert-header">
                    <h2>Team Health</h2>
                    <span className="alert-count">{ROSTER.filter(r => r.risk !== "healthy").length} at risk</span>
                  </div>
                  <div className="team-health-grid">
                    {ROSTER.map(r => (
                      <div key={r.name} className={`roster-card ${r.risk}`}>
                        <div className={`roster-avatar ${r.risk}`}>{r.initials}</div>
                        <div className="roster-name">{r.name}</div>
                        <div className="roster-role">{r.role} · {r.team}</div>
                        <span className={`roster-status ${r.risk}`}>
                          {r.risk === "healthy" ? "Healthy" : r.risk === "high" ? "High Risk" : "Medium Risk"}
                        </span>
                        {r.alertId != null && (
                          <a className="roster-view-link" onClick={() => {
                            const i = alerts.findIndex(a => a.id === r.alertId);
                            if (i !== -1) { setIdx(i); setActiveNav("Alerts"); }
                          }}>View alert →</a>
                        )}
                        {r.name === "Jimmy" && jimmyData && (
                          <a className="roster-view-link" onClick={() => { setProfileView("jimmy"); setProfileTab("physiological"); }}>
                            View profile →
                          </a>
                        )}

                    ))}
                  </div>
                </div>
              ) : (

              <div className="center-panel">
                <div className="alert-header">
                  <h2>Burnout Alerts</h2>
                  <span className="alert-count">{pending} pending</span>
                </div>

                {/* Slideshow controls */}
                <div className="slide-nav">
                  <button className="slide-btn" onClick={() => setIdx(i => Math.max(0, i - 1))} disabled={idx === 0}>←</button>
                  <div className="slide-dots">
                    {alerts.map((a, i) => (
                      <button
                        key={a.id}
                        className={[
                          "dot",
                          i === idx ? "current" : "",
                          assigned.has(a.id) ? "is-assigned" : "",
                          dismissed.has(a.id) ? "is-dismissed" : "",
                        ].join(" ")}
                        onClick={() => setIdx(i)}
                      />
                    ))}
                  </div>
                  <span className="slide-counter">{idx + 1} of {total}</span>
                  <button className="slide-btn" onClick={() => setIdx(i => Math.min(total - 1, i + 1))} disabled={idx === total - 1}>→</button>
                </div>

                {/* Alert card */}
                <div className={`alert-card ${alert.risk.toLowerCase()}`}>
                  {(isAssigned || isDismissed) && (
                    <div className={`action-badge ${isAssigned ? "assigned" : "dismissed"}`}>
                      {isAssigned ? "✓ Day Off Assigned" : "✗ Dismissed"}
                    </div>
                  )}

                  <div className="card-header">
                    <div className="employee-info">
                      <div className={`avatar ${alert.risk.toLowerCase()}`}>{alert.initials}</div>
                      <div>
                        <div className="employee-name">{alert.name}</div>
                        <div className="employee-role">{alert.role} · {alert.team}</div>
                      </div>
                    </div>
                    <div className="risk-badge-wrap">
                      <span className={`risk-badge ${alert.risk.toLowerCase()}`}>{alert.risk} Risk</span>
                      <div className="detected-date">Detected {alert.date}</div>
                    </div>
                  </div>

                  <div className="sentiment-row">
                    <div>
                      <div className="score-label">{alert.scoreLabel}</div>
                      <div className="score-value" style={{ color: accent }}>
                        {alert.score}<span className="score-max">/100</span>
                      </div>
                      <div className="score-sub">{alert.scoreSub}</div>
                    </div>
                    <div className="chart-wrap">
                      <div className="chart-label">{alert.trendLabel}</div>
                      <TrendChart data={alert.trend} color={accent} />
                    </div>
                  </div>

                  <div className="ai-summary">
                    <div className="section-label">AI Analysis</div>
                    <p>{alert.summary}</p>
                  </div>

                  <div className="snippets">
                    <div className="section-label">{alert.signalLabel}</div>
                    {alert.snippets.map((s, i) => (
                      <div key={i} className="snippet">
                        <div className="snippet-meta">
                          <span>{alert.signalIcon}</span>
                          <span className="snippet-time">{s.time}</span>
                        </div>
                        <div className="snippet-text">"{s.text}"</div>
                      </div>
                    ))}
                  </div>

                  <div className="alert-actions">
                    <button
                      className={`btn-assign ${isAssigned ? "done" : ""}`}
                      onClick={handleAssign}
                      disabled={isAssigned || isDismissed}

                    </button>
                    <button
                      className="btn-dismiss"
                      onClick={handleDismiss}
                      disabled={isAssigned || isDismissed}

                      Dismiss

                  </div>
                </div>
              </div>

              )}

              {/* ── Right panel ── */}
              <div className="right-panel">

                <div className="panel-section">
                  <div className="section-label" style={{ marginBottom: 12 }}>Alert Summary</div>
                  <div className="summary-tabs">
                    <button className="summary-tab active">All ({total})</button>
                    <button className="summary-tab">Resolved ({assigned.size})</button>
                  </div>
                  <div className="stat-cards">
                    <div className="stat-card high">
                      <div className="stat-num">{alerts.filter(a => a.risk === "High").length}</div>
                      <div className="stat-lbl">High Risk</div>
                    </div>
                    <div className="stat-card medium">
                      <div className="stat-num">{alerts.filter(a => a.risk === "Medium").length}</div>
                      <div className="stat-lbl">Medium Risk</div>
                    </div>
                    <div className="stat-card green">
                      <div className="stat-num">{assigned.size}</div>
                      <div className="stat-lbl">Days Assigned</div>
                    </div>
                  </div>
                </div>

                <div className="panel-section">
                  <div className="section-label" style={{ marginBottom: 12 }}>Team Breakdown</div>
                  <table className="team-table">
                    <thead>
                      <tr>
                        <th>TEAM</th>
                        <th>ALERTS</th>
                        <th>STATUS</th>
                      </tr>
                    </thead>
                    <tbody>
                      {BASE_TEAM_STATS.map(t => (
                        <tr key={t.team}>

                    </tbody>
                  </table>
                </div>

                <div className="panel-section">

                    <div className="pipe-step done">
                      <div className="pipe-icon">✓</div>

                      <div className="pipe-icon">✓</div>
                      <span>AI sentiment analysis</span>
                    </div>
                    <div className="pipe-step active">
                      <div className="pipe-icon">●</div>
                      <span>HR review &amp; action</span>

                    <div className="pipe-step">
                      <div className="pipe-icon">○</div>

          </div>
        </div>

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
